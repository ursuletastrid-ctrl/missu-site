function genId() {
  return "sub_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
}

function compressImage(file, maxWidth = 360, quality = 0.62) {
  return new Promise((resolve, reject) => {
    const timeout = setTimeout(() => reject(new Error("Délai dépassé lors du traitement de la photo")), 12000);
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        clearTimeout(timeout);
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => { clearTimeout(timeout); reject(new Error("Image illisible")); };
      img.src = e.target.result;
    };
    reader.onerror = () => { clearTimeout(timeout); reject(new Error("Lecture du fichier impossible")); };
    reader.readAsDataURL(file);
  });
}

function formatDate(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" }) +
      " · " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  } catch {
    return iso;
  }
}

// Compteur de places réel pour une offre limitée (ex. "MODÈLE MYU"). Lit la
// disponibilité en direct dans Supabase (policy publique en lecture, aucune
// donnée personnelle) — jamais un chiffre codé en dur, jamais de compte à
// rebours temporel. N'affiche rien tant que la prestation n'est pas une
// offre à stock limité, pour ne pas alourdir les autres cartes.
function OfferSlotBadge({ typePrestation }) {
  const [info, setInfo] = useState(null);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    let cancelled = false;
    fetchPrestationsReservation([typePrestation])
      .then((rows) => { if (!cancelled) { setInfo(rows[0] || null); setLoaded(true); } })
      .catch(() => { if (!cancelled) setLoaded(true); });
    return () => { cancelled = true; };
  }, [typePrestation]);

  if (!loaded || !info || !info.is_limited_offer) return null;

  const total = info.total_slots || 0;
  const remaining = Math.max(0, info.available_slots ?? 0);
  const complet = remaining <= 0;
  const pct = total > 0 ? Math.max(0, Math.min(100, (remaining / total) * 100)) : 0;

  return (
    <div style={{ marginTop: 6 }} onClick={(e) => e.stopPropagation()}>
      <div style={{
        display: "inline-flex", alignItems: "center", gap: 5, padding: "3px 10px", borderRadius: 99,
        background: complet ? "#EFE5E2" : C.blush, border: `1px solid ${complet ? C.blushDeep : C.goldLine}`,
      }}>
        <span style={{
          fontFamily: FONT_BODY, fontSize: 10.5, fontWeight: 500, textTransform: "uppercase", letterSpacing: 0.3,
          color: complet ? C.espressoSoft : C.roseGoldDeep,
        }}>
          {complet ? "Complet" : `${remaining} place${remaining > 1 ? "s" : ""} restante${remaining > 1 ? "s" : ""} sur ${total}`}
        </span>
      </div>
      {!complet && total > 0 && (
        <div style={{ height: 4, borderRadius: 99, background: C.blushDeep, marginTop: 5, overflow: "hidden", maxWidth: 140 }}>
          <div style={{
            height: "100%", width: `${pct}%`, borderRadius: 99,
            background: `linear-gradient(90deg, ${C.roseGold}, ${C.roseGoldDeep})`, transition: "width 0.4s ease",
          }} />
        </div>
      )}
    </div>
  );
}

function CartSummary({ selectedKeys, onRemove }) {
  const items = selectedKeys.map((k) => SERVICES.find((s) => s.key === k)).filter(Boolean);
  const hasUnknown = items.some((s) => !s.price);
  const hasFrom = items.some((s) => s.priceFrom);
  const total = items.reduce((sum, s) => sum + (s.price || 0), 0);

  return (
    <div style={{
      background: C.cream, borderRadius: 20, border: `1.4px solid ${C.goldLine}`,
      padding: "14px 16px", marginBottom: 16,
    }}>
      <div style={{
        fontFamily: FONT_BODY, fontWeight: 500, fontSize: 11.5, color: C.roseGoldDeep,
        textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 10,
      }}>
        Votre sélection
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 10 }}>
        {items.map((s) => (
          <div key={s.key} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
            <span style={{ fontFamily: FONT_BODY, fontSize: 13, color: C.espresso, flex: 1 }}>{s.label}</span>
            <span style={{ fontFamily: FONT_BODY, fontSize: 13, fontWeight: 500, color: C.roseGoldDeep, whiteSpace: "nowrap" }}>
              {formatPrice(s.price, s.priceFrom)}
            </span>
            <button
              onClick={() => onRemove(s.key)}
              className="missu-focusable"
              style={{
                width: 20, height: 20, borderRadius: "50%", background: C.blush, border: "none",
                cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
              }}
            >
              <X size={11} color={C.espressoSoft} />
            </button>
          </div>
        ))}
      </div>
      <div style={{
        display: "flex", alignItems: "center", justifyContent: "space-between",
        paddingTop: 10, borderTop: `1px solid ${C.blushDeep}`,
      }}>
        <span style={{ fontFamily: FONT_BODY, fontSize: 13, fontWeight: 500, color: C.espresso }}>
          {hasFrom || hasUnknown ? "Total estimé" : "Total"}
        </span>
        <span style={{ fontFamily: FONT_DISPLAY, fontSize: 19, fontWeight: 600, color: C.roseGoldDeep }}>
          {hasFrom ? "à partir de " : ""}{total}€
        </span>
      </div>
      {hasUnknown && (
        <p style={{ fontFamily: FONT_BODY, fontSize: 10.5, color: C.espressoSoft, margin: "8px 0 0", lineHeight: 1.4 }}>
          Certaines prestations sont sur devis — le tarif définitif vous sera confirmé lors du pré-diagnostic.
        </p>
      )}
    </div>
  );
}

      {loading ? (

          width: "100%", height: 118, display: "flex", flexDirection: "column",

            position: "absolute", bottom: 0, left: 0, right: 0, background: "rgba(74,55,47,0.55)",

          </div>
        </div>
      ) : (
        <label
          className="missu-focusable"
          style={{
            position: "relative",
            width: "100%", height: 118, cursor: "pointer",
            display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 6,
          }}
        >

          </span>
        </label>
      )}
    </div>
  );
}

function PhotosStep({ photos, onUpload, onRemove, onNext, onBack }) {
  const requiredZones = PHOTO_ZONES.filter((z) => z.required);
  const valid = requiredZones.every((z) => !!photos[z.key]);
  const [loadingZones, setLoadingZones] = useState({});
  const [errorMsg, setErrorMsg] = useState("");

  const handleUpload = async (zoneKey, file) => {
    setErrorMsg("");
    if (file.size > 15 * 1024 * 1024) {
      setErrorMsg("Cette photo est trop volumineuse (max 15 Mo). Merci d'en choisir une autre.");
      return;
    }
    setLoadingZones((prev) => ({ ...prev, [zoneKey]: true }));
    try {
      await onUpload(zoneKey, file);
    } catch (e) {
      setErrorMsg("Impossible d'ajouter cette photo. Merci de réessayer avec une autre image.");
    } finally {
      setLoadingZones((prev) => {
        const next = { ...prev };
        delete next[zoneKey];
        return next;
      });
    }
  };

  return (
    <div className="missu-step">
      <StepHeader onBack={onBack} title="Ajoutez vos photos" />
      <ProgressDots step={3} total={6} />
      <p style={{ fontFamily: FONT_BODY, fontSize: 13.5, color: C.espressoSoft, lineHeight: 1.6, marginTop: 0 }}>
        Merci d'importer des photos nettes, sans filtre, prises en lumière naturelle. Ces photos servent
        uniquement à évaluer votre demande et ne seront jamais publiées sans votre accord.
      </p>

      {errorMsg && (
        <div style={{
          display: "flex", alignItems: "center", gap: 8, background: "#FBEAE6",
          border: "1px solid #E0B6AC", borderRadius: 14, padding: "10px 12px", marginBottom: 4,
        }}>
          <AlertCircle size={14} color={C.danger} />
          <span style={{ fontFamily: FONT_BODY, fontSize: 12, color: C.danger }}>{errorMsg}</span>
        </div>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, margin: "16px 0" }}>
        {PHOTO_ZONES.map((zone) => (
          <UploadZone
            key={zone.key}
            zone={zone}
            image={photos[zone.key]}
            loading={!!loadingZones[zone.key]}
            onUpload={handleUpload}
            onRemove={onRemove}
          />
        ))}
      </div>

      <div style={{
        background: C.blush, borderRadius: 16, padding: "12px 14px", marginBottom: 22,
        display: "flex", flexDirection: "column", gap: 6,
      }}>
        {["Pas de filtre", "Lumière naturelle", "Pas de maquillage sur la zone"].map((tip) => (
          <div key={tip} style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <Check size={13} color={C.roseGoldDeep} />
            <span style={{ fontFamily: FONT_BODY, fontSize: 12.5, color: C.espresso }}>{tip}</span>
          </div>
        ))}
      </div>

      <PrimaryButton onClick={onNext} disabled={!valid} icon={ChevronRight}>Continuer</PrimaryButton>
    </div>
  );
}

function ContraStep({ selected, onToggle, otherText, onOtherText, onNext, onBack, services }) {
  const noneSelected = selected.length === 0;
  const selectedCategories = new Set(
    (services || []).map((k) => SERVICES.find((s) => s.key === k)?.category).filter(Boolean)
  );
  const isRelevant = (item) => {
    const cats = CONTRAINDICATION_RELEVANCE[item];
    if (!cats) return false;
    return cats.some((c) => selectedCategories.has(c));
  };
  return (
    <div className="missu-step">
      <StepHeader onBack={onBack} title="Votre santé, en toute confidentialité" subtitle="Cochez ce qui vous concerne. Ces informations restent strictement confidentielles et permettent d'assurer votre sécurité." />
      <ProgressDots step={4} total={6} />
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 14 }}>
        {CONTRAINDICATIONS.map((item) => {
          const checked = selected.includes(item);
          const relevant = isRelevant(item);
          return (
            <button
              key={item}
              onClick={() => onToggle(item)}
              className="missu-focusable"
              style={{
                display: "flex", alignItems: "flex-start", gap: 10, textAlign: "left",
                padding: "12px 14px", borderRadius: 14, cursor: "pointer",
                border: checked ? `1.5px solid ${C.roseGoldDeep}` : relevant ? `1.3px solid ${C.roseGold}` : `1.3px solid ${C.blushDeep}`,
                background: checked ? C.blush : C.cream,
              }}
            >
              <div style={{
                width: 18, height: 18, borderRadius: 6, flexShrink: 0, marginTop: 1,
                border: `1.5px solid ${checked ? C.roseGoldDeep : C.blushDeep}`,
                background: checked ? C.roseGoldDeep : "transparent",
                display: "flex", alignItems: "center", justifyContent: "center",
              }}>
                {checked && <Check size={12} color="white" />}
              </div>
              <span style={{ fontFamily: FONT_BODY, fontSize: 13, color: C.espresso, lineHeight: 1.4, flex: 1 }}>
                {item}
                {relevant && (
                  <span style={{ display: "block", fontSize: 10.5, color: C.roseGoldDeep, marginTop: 2 }}>
                    Particulièrement pertinent pour votre sélection
                  </span>
                )}
              </span>
            </button>
          );
        })}
      </div>

      <div style={{ marginBottom: 14 }}>
        <FieldLabel>Autre situation à signaler</FieldLabel>
        <textarea
          value={otherText}
          onChange={(e) => onOtherText(e.target.value)}
          placeholder="Facultatif"
          rows={2}
          className="missu-focusable"
          style={{ ...inputStyle, resize: "vertical", fontFamily: FONT_BODY }}
        />
      </div>

      {noneSelected && (
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 18, color: C.espressoSoft }}>
          <AlertCircle size={14} />
          <span style={{ fontFamily: FONT_BODY, fontSize: 12 }}>Aucune situation cochée = aucune de ces situations ne vous concerne.</span>
        </div>
      )}
      {!noneSelected && <div style={{ height: 18 }} />}

      <PrimaryButton onClick={onNext} icon={ChevronRight}>Continuer</PrimaryButton>
    </div>
  );
}

async function fetchSubmissionsFromSheet(token) {
  const url = SHEETS_WEBAPP_URL + "?token=" + encodeURIComponent(token || "");
  const res = await fetch(url, { method: "GET" });
  const data = await res.json();
  if (!Array.isArray(data)) {

      email: row.email, city: row.city,

function genReferralCode(firstName) {
  const base = (firstName || "MYU")
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .toUpperCase().replace(/[^A-Z]/g, "").slice(0, 10) || "MYU";
  const suffix = Math.random().toString(36).slice(2, 6).toUpperCase();
  return `MYU-${base}-${suffix}`;
}

// Un compte créé (auth) ne vaut jamais consentement à une prestation —
// on se contente ici de créer la fiche profil minimale, une seule fois.
async function ensureProfile(user) {
  if (!user) return null;
  const { data: existing, error: readErr } = await supabase
    .from("profiles").select("*").eq("id", user.id).maybeSingle();
  if (readErr) throw readErr;
  if (existing) return existing;

  const meta = user.user_metadata || {};
  const referral_code = genReferralCode(meta.first_name);
  const { data: created, error: insertErr } = await supabase
    .from("profiles")
    .insert({
      id: user.id,
      first_name: meta.first_name || "",
      last_name: meta.last_name || "",
      phone: meta.phone || "",
      city: meta.city || "",
      referral_code,
    })
    .select().single();
  if (insertErr) throw insertErr;
  return created;
}

// côté navigateur). Renvoie { rendezVous, checkoutUrl }. Si l'offre est à
// stock limité et qu'il n'y a plus de place, le serveur répond une erreur
// claire ("COMPLET") plutôt que de créer un paiement pour rien.
async function createBookingCheckout({ typePrestation, dateRdv, heureRdv }) {
  const { data: sessionData, error: sessErr } = await supabase.auth.getSession();
  if (sessErr) throw sessErr;
  const token = sessionData.session?.access_token;
  if (!token) throw new Error("Session expirée. Merci de vous reconnecter.");
  const res = await fetch("/api/create-checkout", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
    body: JSON.stringify({ typePrestation, dateRdv: dateRdv || null, heureRdv: heureRdv || null }),
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok || !body.success) throw new Error(body?.error || "Impossible de créer le paiement.");
  return body.data;
}

    s.personal.email || "",

    servicesLabel(s),
    s.planning?.lieu || "",

    s.planning?.periode || "",
    STATUS_OPTIONS.find((o) => o.key === s.status)?.label || s.status,
    (s.contraindications?.selected || []).join(" | "),
  ]);
  const csv = [headers, ...rows]
    .map((r) => r.map((cell) => `"${String(cell).replace(/"/g, '""')}"`).join(","))
    .join("\n");
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `missu-demandes-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

            display: "flex", alignItems: "center", gap: 4, fontFamily: FONT_BODY, fontSize: 12,
          }}>
            <LogOut size={15} />
          </button>
        </div>
      </div>

      <div style={{ display: "flex", gap: 8, margin: "16px 0 12px" }}>
        <div style={{ flex: 1, position: "relative" }}>
          <Search size={14} color={C.roseGoldDeep} style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)" }} />
          <input
            value={search}
            onChange={(e) => setSearch(e.target.value)}
            placeholder="Rechercher une cliente..."
            className="missu-focusable"
            style={{ ...inputStyle, paddingLeft: 34, fontSize: 13, padding: "10px 14px 10px 34px" }}
          />
        </div>
        <button
          onClick={() => exportCSV(submissions)}
          className="missu-focusable"
          title="Exporter en CSV"
          style={{
            width: 42, borderRadius: 16, border: `1.4px solid ${C.blushDeep}`, background: C.white,
            cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center",
          }}
        >
          <Download size={16} color={C.roseGoldDeep} />
        </button>
      </div>

      <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 4, marginBottom: 16 }}>
        {[{ key: "all", label: "Toutes" }, ...STATUS_OPTIONS].map((opt) => (
          <button
            key={opt.key}
            onClick={() => setStatusFilter(opt.key)}
            className="missu-focusable"
            style={{
              flexShrink: 0, padding: "7px 14px", borderRadius: 99, cursor: "pointer",
              fontFamily: FONT_BODY, fontSize: 12, fontWeight: 500,
              border: statusFilter === opt.key ? `1.5px solid ${C.roseGoldDeep}` : `1.3px solid ${C.blushDeep}`,
              background: statusFilter === opt.key ? C.blush : C.white,
              color: C.espresso,
            }}
          >
            {opt.label}
          </button>
        ))}
      </div>

      {loading && (
        <p style={{ fontFamily: FONT_BODY, fontSize: 13, color: C.espressoSoft, textAlign: "center", padding: "30px 0" }}>
          Chargement des demandes...
        </p>
      )}

      {!loading && filtered.length === 0 && (
        <div style={{ textAlign: "center", padding: "40px 10px" }}>
          <ClipboardList size={28} color={C.blushDeep} style={{ marginBottom: 10 }} />
          <p style={{ fontFamily: FONT_BODY, fontSize: 13, color: C.espressoSoft }}>
            {submissions.length === 0 ? "Aucune demande reçue pour le moment." : "Aucun résultat pour cette recherche."}
          </p>
        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {filtered.map((s) => {
          const hasContra = (s.contraindications?.selected || []).length > 0;
          return (
            <button
              key={s.id}
              onClick={() => onOpen(s.id)}
              className="missu-focusable"
              style={{
                textAlign: "left", borderRadius: 18, padding: "14px 16px", cursor: "pointer",
                background: C.cream, border: `1.3px solid ${C.blushDeep}`,
                display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10,
              }}
            >
              <div style={{ minWidth: 0 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <span style={{ fontFamily: FONT_BODY, fontWeight: 500, fontSize: 14.5, color: C.espresso }}>
                    {s.personal.firstName} {s.personal.lastName}
                  </span>
                  {hasContra && <AlertCircle size={13} color={C.danger} />}
                </div>
                <div style={{ fontFamily: FONT_BODY, fontSize: 12, color: C.espressoSoft, margin: "3px 0" }}>
                  {servicesLabel(s) || "—"}
                </div>
                {s.planning?.date && (
                  <div style={{ fontFamily: FONT_BODY, fontSize: 10.5, color: C.roseGoldDeep, marginBottom: 2 }}>
                    Souhaité : {s.planning.date} · {s.planning.periode} · {s.planning.lieu}
                  </div>
                )}
                <div style={{ fontFamily: FONT_BODY, fontSize: 10.5, color: C.espressoSoft, opacity: 0.75 }}>
                  {formatDate(s.createdAt)}
                </div>
              </div>
              <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 8 }}>
                <StatusBadge status={s.status} />
                <ChevronRight size={16} color={C.roseGoldDeep} />
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

const RDV_STATUS_OPTIONS = [
  { key: "demande", label: "Demandé" },
  { key: "en_attente_paiement", label: "Acompte en attente" },
  { key: "confirme", label: "Confirmé" },
  { key: "modifie", label: "Modifié" },
  { key: "terminee", label: "Terminé" },
  { key: "annule", label: "Annulé" },
];

const PAYMENT_STATUS_LABELS = {
  non_requis: "Sans acompte",
  en_attente: "Acompte en attente",
  paye: "Acompte réglé",
  echoue: "Paiement échoué",
  rembourse: "Remboursé",
};

/* ============================================================
   ADMIN SPACE — Mon Espace MYU (recherche cliente, fiche cliente,
   fidélité, parrainage, rendez-vous, consignes, notes internes)
   ============================================================ */
function AdminMyuPanel({ adminToken }) {
  const [query, setQuery] = useState("");
  const [results, setResults] = useState([]);
  const [searching, setSearching] = useState(false);
  const [searchError, setSearchError] = useState("");
  const [selectedClientId, setSelectedClientId] = useState(null);
  const [showConsignes, setShowConsignes] = useState(false);
  const [showModeleSlots, setShowModeleSlots] = useState(false);

  const doSearch = async () => {
    if (!query.trim()) return;
    setSearching(true); setSearchError("");
    try {
      const data = await callAdminMyu("searchClients", { query: query.trim() }, adminToken);
      setResults(data);
    } catch (e) { setSearchError(e.message); }
    setSearching(false);
  };

  if (selectedClientId) {
    return (
      <AdminClientDetail clientId={selectedClientId} adminToken={adminToken} onBack={() => setSelectedClientId(null)} />
    );
  }

  if (showConsignes) {
    return <AdminConsignesEditor adminToken={adminToken} onBack={() => setShowConsignes(false)} />;
  }

  if (showModeleSlots) {
    return <AdminModeleSlotsPanel adminToken={adminToken} onBack={() => setShowModeleSlots(false)} />;
  }

  return (
    <div className="missu-step">
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14, flexWrap: "wrap", gap: 8 }}>
        <span style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 20, color: C.espresso }}>
          Mon Espace MYU
        </span>
        <div style={{ display: "flex", gap: 8 }}>
          <GhostButton onClick={() => setShowModeleSlots(true)} icon={Sparkle}>MODÈLE MYU</GhostButton>
          <GhostButton onClick={() => setShowConsignes(true)} icon={ClipboardList}>Consignes</GhostButton>
        </div>
      </div>

      <TextInput
        icon={Search} value={query} onChange={(e) => setQuery(e.target.value)}
        placeholder="Nom, téléphone, ville ou email..."
        onKeyDown={(e) => { if (e.key === "Enter") doSearch(); }}
      />
      <div style={{ height: 10 }} />
      <PrimaryButton onClick={doSearch} disabled={searching || !query.trim()} icon={Search}>
        {searching ? "Recherche..." : "Rechercher une cliente"}
      </PrimaryButton>
      <ErrorNote>{searchError}</ErrorNote>

      <div style={{ marginTop: 16, display: "flex", flexDirection: "column", gap: 8 }}>
        {results.map((r) => (
          <button
            key={r.id}
            onClick={() => setSelectedClientId(r.id)}
            className="missu-focusable"
            style={{
              textAlign: "left", borderRadius: 16, padding: "12px 14px", cursor: "pointer",
              background: C.cream, border: `1.3px solid ${C.blushDeep}`,
              display: "flex", alignItems: "center", justifyContent: "space-between",
            }}
          >
            <div>
              <div style={{ fontFamily: FONT_BODY, fontWeight: 500, fontSize: 14, color: C.espresso }}>
                {r.first_name} {r.last_name}
              </div>
              <div style={{ fontFamily: FONT_BODY, fontSize: 11.5, color: C.espressoSoft }}>
                {[r.phone, r.city, r.email].filter(Boolean).join(" · ") || "—"}
              </div>
            </div>
            <ChevronRight size={16} color={C.roseGoldDeep} />
          </button>
        ))}
        {!searching && query && results.length === 0 && !searchError && (
          <p style={{ fontFamily: FONT_BODY, fontSize: 12.5, color: C.espressoSoft, textAlign: "center", padding: "16px 0" }}>
            Aucune cliente trouvée pour cette recherche.
          </p>
        )}
      </div>
    </div>
  );
}

function AdminClientDetail({ clientId, adminToken, onBack }) {
  const [detail, setDetail] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [newPrestaType, setNewPrestaType] = useState("");
  const [newPrestaDate, setNewPrestaDate] = useState("");
  const [newNote, setNewNote] = useState("");

  const load = useCallback(async () => {
    setLoading(true); setError("");
    try {
      const data = await callAdminMyu("getClient", { clientId }, adminToken);
      setDetail(data);
    } catch (e) { setError(e.message); }
    setLoading(false);
  }, [clientId, adminToken]);

  useEffect(() => { load(); }, [load]);

  const act = async (action, payload) => {
    setBusy(true);
    try {
      await callAdminMyu(action, payload, adminToken);
      await load();
    } catch (e) { setError(e.message); }
    setBusy(false);
  };

  if (loading) {
    return (
      <div className="missu-step" style={{ paddingTop: 40, textAlign: "center" }}>
        <p style={{ fontFamily: FONT_BODY, fontSize: 13, color: C.espressoSoft }}>Chargement de la fiche cliente...</p>
      </div>
    );
  }

  if (!detail || !detail.profile) {
    return (
      <div className="missu-step">
        <GhostButton onClick={onBack} icon={ChevronLeft}>Retour à la recherche</GhostButton>
        <ErrorNote>{error || "Cliente introuvable."}</ErrorNote>
      </div>
    );
  }

  const p = detail.profile;

  return (
    <div className="missu-step">
      <GhostButton onClick={onBack} icon={ChevronLeft}>Retour à la recherche</GhostButton>

      <div style={{ margin: "8px 0 16px" }}>
        <h2 style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 22, color: C.espresso, margin: 0 }}>
          {p.first_name} {p.last_name}
        </h2>
        <p style={{ fontFamily: FONT_BODY, fontSize: 12, color: C.espressoSoft, margin: "3px 0 0" }}>
          {[detail.email, p.phone, p.city].filter(Boolean).join(" · ") || "—"}
        </p>
      </div>

      <ErrorNote>{error}</ErrorNote>

      <SectionCard title="Fidélité">
        <LoyaltyCard tampons={detail.fidelite?.tampons || 0} />
        <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
          <div style={{ flex: 1 }}>
            <PrimaryButton onClick={() => act("addTampon", { clientId })} disabled={busy || (detail.fidelite?.tampons || 0) >= 3}>
              Ajouter un tampon
            </PrimaryButton>
          </div>
          <GhostButton onClick={() => act("resetTampons", { clientId })}>Réinitialiser</GhostButton>
        </div>
      </SectionCard>

      <SectionCard title="Prestations">
        {detail.prestations.length === 0 && (
          <p style={{ fontFamily: FONT_BODY, fontSize: 12.5, color: C.espressoSoft, margin: "0 0 12px" }}>
            Aucune prestation enregistrée pour cette cliente.
          </p>
        )}
        {detail.prestations.map((pr) => (
          <div key={pr.id} style={{ padding: "10px 0", borderBottom: `1px solid ${C.blush}` }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
              <span style={{ fontFamily: FONT_BODY, fontSize: 13.5, fontWeight: 500, color: C.espresso }}>
                {prestationLabel(pr.type_prestation)}
              </span>
              <PrestationStatusBadge status={pr.statut} />
            </div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {PRESTATION_STATUS.map((opt) => (
                <button
                  key={opt.key}
                  onClick={() => act("updatePrestationStatus", { prestationId: pr.id, statut: opt.key })}
                  disabled={busy}
                  className="missu-focusable"
                  style={{
                    padding: "4px 10px", borderRadius: 99, cursor: busy ? "not-allowed" : "pointer",
                    fontFamily: FONT_BODY, fontSize: 10.5, fontWeight: 500,
                    border: pr.statut === opt.key ? `1.4px solid ${opt.color}` : `1.2px solid ${C.blushDeep}`,
                    background: pr.statut === opt.key ? `${opt.color}1A` : C.white,
                    color: pr.statut === opt.key ? opt.color : C.espressoSoft,
                  }}
                >
                  {opt.label}
                </button>
              ))}
            </div>
          </div>
        ))}
        <div style={{ marginTop: 12 }}>
          <FieldLabel>Ajouter une prestation</FieldLabel>
          <select value={newPrestaType} onChange={(e) => setNewPrestaType(e.target.value)} className="missu-focusable" style={{ ...inputStyle }}>
            <option value="">Choisir une prestation</option>
            {SERVICES.map((s) => (
              <option key={s.key} value={s.key}>{s.label}</option>
            ))}
          </select>
          <div style={{ height: 8 }} />
          <TextInput type="date" value={newPrestaDate} onChange={(e) => setNewPrestaDate(e.target.value)} />
          <div style={{ height: 10 }} />
          <PrimaryButton
            onClick={async () => {
              await act("createPrestation", { clientId, typePrestation: newPrestaType, datePrestation: newPrestaDate || null });
              setNewPrestaType(""); setNewPrestaDate("");
            }}
            disabled={busy || !newPrestaType}
            icon={CalendarCheck}
          >
            Ajouter
          </PrimaryButton>
        </div>
      </SectionCard>

      <SectionCard title="Recommandations (parrainage)">
        {detail.parrainages.length === 0 ? (
          <p style={{ fontFamily: FONT_BODY, fontSize: 12.5, color: C.espressoSoft, margin: 0 }}>Aucune recommandation.</p>
        ) : (
          detail.parrainages.map((pa) => (
            <div key={pa.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "8px 0", borderBottom: `1px solid ${C.blush}` }}>
              <span style={{ fontFamily: FONT_BODY, fontSize: 13, color: C.espresso }}>{pa.filleul_email}</span>
              {pa.statut === "validee" ? (
                <span style={{ fontFamily: FONT_BODY, fontSize: 10.5, color: C.success, textTransform: "uppercase" }}>Validée</span>
              ) : (
                <GhostButton onClick={() => act("validateParrainage", { parrainageId: pa.id })} icon={BadgeCheck}>Valider</GhostButton>
              )}
            </div>
          ))
        )}
      </SectionCard>

      {detail.avantages.length > 0 && (
        <SectionCard title="Avantages">
          {detail.avantages.map((a) => (
            <div key={a.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "8px 0", borderBottom: `1px solid ${C.blush}` }}>
              <div>
                <div style={{ fontFamily: FONT_BODY, fontSize: 13, color: C.espresso }}>{a.type_avantage}</div>
                {a.description && <div style={{ fontFamily: FONT_BODY, fontSize: 11, color: C.espressoSoft }}>{a.description}</div>}
              </div>
              {a.statut === "disponible" ? (
                <GhostButton onClick={() => act("markAvantageUsed", { avantageId: a.id })}>Marquer utilisé</GhostButton>
              ) : (
                <span style={{ fontFamily: FONT_BODY, fontSize: 10.5, color: C.espressoSoft, textTransform: "uppercase" }}>Utilisé</span>
              )}
            </div>
          ))}
        </SectionCard>
      )}

      <SectionCard title="Rendez-vous">
        {detail.rendezVous.length === 0 ? (
          <p style={{ fontFamily: FONT_BODY, fontSize: 12.5, color: C.espressoSoft, margin: 0 }}>Aucun rendez-vous.</p>
        ) : (
          detail.rendezVous.map((r) => {
            const rdvLabel = r.type_prestation ? prestationLabel(r.type_prestation) : r.prestation;
            return (
            <div key={r.id} style={{ padding: "8px 0", borderBottom: `1px solid ${C.blush}` }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
                <span style={{ fontFamily: FONT_BODY, fontSize: 13, color: C.espresso }}>{rdvLabel}</span>
                <span style={{ fontFamily: FONT_BODY, fontSize: 10.5, color: C.espressoSoft, textTransform: "uppercase" }}>
                  {r.date_rdv ? new Date(r.date_rdv).toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" }) : "Date à confirmer"}
                  {r.heure_rdv ? ` à ${r.heure_rdv.slice(0, 5)}` : ""}
                </span>
              </div>
              {r.deposit_amount > 0 && (
                <div style={{ fontFamily: FONT_BODY, fontSize: 11, color: C.roseGoldDeep, marginBottom: 6 }}>
                  Acompte {r.deposit_amount}€ · {PAYMENT_STATUS_LABELS[r.payment_status] || r.payment_status}
                  {r.payment_reference && (
                    <span style={{ color: C.espressoSoft }}> · réf. {r.payment_reference.slice(0, 10)}…</span>
                  )}
                </div>
              )}
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                {RDV_STATUS_OPTIONS.map((opt) => (
                  <button
                    key={opt.key}
                    onClick={() => act("updateRendezVous", { rdvId: r.id, statut: opt.key, releaseSlot: opt.key === "annule" })}
                    disabled={busy}
                    className="missu-focusable"
                    style={{
                      padding: "4px 10px", borderRadius: 99, cursor: busy ? "not-allowed" : "pointer",
                      fontFamily: FONT_BODY, fontSize: 10.5, fontWeight: 500,
                      border: r.statut === opt.key ? `1.4px solid ${C.roseGoldDeep}` : `1.2px solid ${C.blushDeep}`,
                      background: r.statut === opt.key ? C.blush : C.white,
                      color: C.espresso,
                    }}
                  >
                    {opt.label}
                  </button>
                ))}
              </div>
              {r.type_prestation === "modele_myu" && r.statut !== "annule" && (
                <div style={{ marginTop: 6 }}>
                  <GhostButton
                    onClick={() => act("releaseModeleSlot", { typePrestation: "modele_myu" })}
                  >
                    Libérer une place MODÈLE MYU
                  </GhostButton>
                </div>
              )}
            </div>
            );
          })
        )}
      </SectionCard>

      <SectionCard title="Documents & consentements">
        {detail.documents.length === 0 ? (
          <p style={{ fontFamily: FONT_BODY, fontSize: 12.5, color: C.espressoSoft, margin: 0 }}>Aucun document.</p>
        ) : (
          detail.documents.map((d) => (
            <div key={d.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 0", borderBottom: `1px solid ${C.blush}` }}>
              <FileText size={14} color={C.roseGoldDeep} />
              <span style={{ fontFamily: FONT_BODY, fontSize: 12.5, color: C.espresso }}>
                {d.type_consentement} · v{d.version} · {new Date(d.accepte_le).toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" })}
              </span>
            </div>
          ))
        )}
      </SectionCard>

      <SectionCard title="Notes internes (jamais visibles côté cliente)" alert>
        {detail.notes.map((n) => (
          <div key={n.id} style={{ padding: "8px 0", borderBottom: `1px solid ${C.blush}` }}>
            <p style={{ fontFamily: FONT_BODY, fontSize: 12.5, color: C.espresso, margin: 0, whiteSpace: "pre-wrap" }}>{n.note}</p>
            <div style={{ fontFamily: FONT_BODY, fontSize: 10, color: C.espressoSoft, marginTop: 2 }}>
              {new Date(n.created_at).toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" })}
            </div>
          </div>
        ))}
        <div style={{ marginTop: 10 }}>
          <textarea
            value={newNote} onChange={(e) => setNewNote(e.target.value)}
            placeholder="Ajouter une note interne..."
            className="missu-focusable"
            style={{ ...inputStyle, minHeight: 60, resize: "vertical", fontFamily: FONT_BODY }}
          />
          <div style={{ height: 8 }} />
          <PrimaryButton
            onClick={async () => { await act("addNoteInterne", { clientId, note: newNote }); setNewNote(""); }}
            disabled={busy || !newNote.trim()}
          >
            Ajouter la note
          </PrimaryButton>
        </div>
      </SectionCard>
    </div>
  );
}

function AdminConsignesEditor({ adminToken, onBack }) {
  const [values, setValues] = useState({});
  const [saving, setSaving] = useState({});
  const [error, setError] = useState("");
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    callAdminMyu("listConsignes", {}, adminToken).then((rows) => {
      const map = {};
      (rows || []).forEach((r) => { map[r.type_prestation] = { titre: r.titre || "", contenu: r.contenu || "" }; });
      setValues(map);
      setLoaded(true);
    }).catch((e) => { setError(e.message); setLoaded(true); });
  }, [adminToken]);

  const save = async (key) => {
    setSaving((s) => ({ ...s, [key]: true }));
    try {
      await callAdminMyu("upsertConsigne", {
        typePrestation: key,
        titre: values[key]?.titre || "",
        contenu: values[key]?.contenu || "",
      }, adminToken);
    } catch (e) { setError(e.message); }
    setSaving((s) => ({ ...s, [key]: false }));
  };

  return (
    <div className="missu-step">
      <GhostButton onClick={onBack} icon={ChevronLeft}>Retour</GhostButton>
      <h2 style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 20, color: C.espresso, margin: "8px 0 14px" }}>
        Consignes par prestation
      </h2>
      <ErrorNote>{error}</ErrorNote>
      {!loaded && (
        <p style={{ fontFamily: FONT_BODY, fontSize: 13, color: C.espressoSoft }}>Chargement...</p>
      )}
      {loaded && SERVICES.filter((s) => s.category !== "accompagnement").map((s) => (
        <SectionCard key={s.key} title={s.label}>
          <FieldLabel>Titre affiché à la cliente</FieldLabel>
          <TextInput
            value={values[s.key]?.titre || ""}
            onChange={(e) => setValues((v) => ({ ...v, [s.key]: { ...v[s.key], titre: e.target.value } }))}
            placeholder={s.label}
          />
          <div style={{ height: 10 }} />
          <FieldLabel>Consignes de soin</FieldLabel>
          <textarea
            value={values[s.key]?.contenu || ""}
            onChange={(e) => setValues((v) => ({ ...v, [s.key]: { ...v[s.key], contenu: e.target.value } }))}
            placeholder="Consignes post-prestation transmises à la cliente..."
            className="missu-focusable"
            style={{ ...inputStyle, minHeight: 90, resize: "vertical", fontFamily: FONT_BODY }}
          />
          <div style={{ height: 10 }} />
          <GhostButton onClick={() => save(s.key)} icon={Check}>
            {saving[s.key] ? "Enregistrement..." : "Enregistrer"}
          </GhostButton>
        </SectionCard>
      ))}
    </div>
  );
}

// Vue admin dédiée à l'offre limitée "MODÈLE MYU" : places réelles
// (total/vendues/restantes, lues directement dans prestations_reservation —
// jamais un chiffre recalculé ou approximatif), montant de l'acompte
// éditable en un seul endroit (réutilisé par le site public et par
// /api/create-checkout, aucun doublon), et la liste des clientes ayant
// réservé avec leur statut de paiement.
function AdminModeleSlotsPanel({ adminToken, onBack }) {
  const TYPE = "modele_myu";
  const [reservation, setReservation] = useState(null);
  const [bookings, setBookings] = useState([]);
  const [depositInput, setDepositInput] = useState("");
  const [loading, setLoading] = useState(true);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  const load = useCallback(async () => {
    setLoading(true); setError("");
    try {
      const [all, list] = await Promise.all([
        callAdminMyu("listPrestationsReservation", {}, adminToken),
        callAdminMyu("listModeleBookings", { typePrestation: TYPE }, adminToken),
      ]);
      const modele = (all || []).find((r) => r.type_prestation === TYPE) || null;
      setReservation(modele);
      setDepositInput(modele ? String(modele.deposit_amount) : "");
      setBookings(list || []);
    } catch (e) { setError(e.message); }
    setLoading(false);
  }, [adminToken]);

  useEffect(() => { load(); }, [load]);

  const saveDeposit = async () => {
    setBusy(true); setError("");
    try {
      await callAdminMyu("upsertPrestationReservation", { typePrestation: TYPE, depositAmount: Number(depositInput) || 0 }, adminToken);
      await load();
    } catch (e) { setError(e.message); }
    setBusy(false);
  };

  const toggleActive = async () => {
    setBusy(true); setError("");
    try {
      await callAdminMyu("upsertPrestationReservation", { typePrestation: TYPE, active: !reservation.active }, adminToken);
      await load();
    } catch (e) { setError(e.message); }
    setBusy(false);
  };

  const releaseSlot = async () => {
    setBusy(true); setError("");
    try {
      await callAdminMyu("releaseModeleSlot", { typePrestation: TYPE }, adminToken);
      await load();
    } catch (e) { setError(e.message); }
    setBusy(false);
  };

  return (
    <div className="missu-step">
      <GhostButton onClick={onBack} icon={ChevronLeft}>Retour</GhostButton>
      <h2 style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 20, color: C.espresso, margin: "8px 0 14px" }}>
        Offre MODÈLE MYU
      </h2>
      <ErrorNote>{error}</ErrorNote>
      {loading && (
        <p style={{ fontFamily: FONT_BODY, fontSize: 13, color: C.espressoSoft }}>Chargement...</p>
      )}
      {!loading && !reservation && (
        <p style={{ fontFamily: FONT_BODY, fontSize: 13, color: C.espressoSoft }}>
          Offre introuvable — vérifier que la migration schema_reservations_acompte.sql a bien été exécutée dans Supabase.
        </p>
      )}
      {!loading && reservation && (
        <>
          <SectionCard title="Places">
            <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 26, color: C.roseGoldDeep }}>
              {reservation.available_slots}
              <span style={{ fontSize: 14, color: C.espressoSoft, fontWeight: 400 }}> / {reservation.total_slots} restantes</span>
            </div>
            <p style={{ fontFamily: FONT_BODY, fontSize: 12, color: C.espressoSoft, margin: "4px 0 12px" }}>
              {(reservation.total_slots || 0) - (reservation.available_slots || 0)} vendue(s) et confirmée(s)
            </p>
            <GhostButton onClick={releaseSlot} disabled={busy || reservation.available_slots >= reservation.total_slots}>
              Libérer une place
            </GhostButton>
          </SectionCard>

          <SectionCard title="Acompte">
            <FieldLabel>Montant de l'acompte (€)</FieldLabel>
            <TextInput type="number" value={depositInput} onChange={(e) => setDepositInput(e.target.value)} />
            <div style={{ height: 10 }} />
            <GhostButton onClick={saveDeposit} disabled={busy} icon={Check}>Enregistrer</GhostButton>
          </SectionCard>

          <SectionCard title="Disponibilité de l'offre">
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
              <span style={{ fontFamily: FONT_BODY, fontSize: 13, color: C.espresso }}>
                {reservation.active ? "Offre active (visible et réservable)" : "Offre désactivée (masquée du site)"}
              </span>
              <GhostButton onClick={toggleActive} disabled={busy}>
                {reservation.active ? "Désactiver" : "Activer"}
              </GhostButton>
            </div>
          </SectionCard>
        </>
      )}

      <SectionCard title={`Réservations (${bookings.length})`}>
        {bookings.length === 0 ? (
          <p style={{ fontFamily: FONT_BODY, fontSize: 12.5, color: C.espressoSoft, margin: 0 }}>Aucune réservation pour l'instant.</p>
        ) : (
          bookings.map((b) => (
            <div key={b.id} style={{ padding: "8px 0", borderBottom: `1px solid ${C.blush}` }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                <span style={{ fontFamily: FONT_BODY, fontSize: 13, color: C.espresso }}>
                  {b.client ? `${b.client.first_name} ${b.client.last_name}` : "Cliente inconnue"}
                </span>
                <span style={{ fontFamily: FONT_BODY, fontSize: 10.5, color: C.espressoSoft, textTransform: "uppercase" }}>
                  {b.date_rdv ? new Date(b.date_rdv).toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" }) : "Date à confirmer"}
                </span>
              </div>
              <div style={{ fontFamily: FONT_BODY, fontSize: 11, color: C.roseGoldDeep, marginTop: 2 }}>
                {RDV_STATUS_OPTIONS.find((o) => o.key === b.statut)?.label || b.statut} · {PAYMENT_STATUS_LABELS[b.payment_status] || b.payment_status}
                {b.client?.phone ? ` · ${b.client.phone}` : ""}
              </div>
            </div>
          ))
        )}
      </SectionCard>
    </div>
  );
}

function friendlyAuthError(e) {
  const msg = (e && e.message) || "";
  if (/Invalid login credentials/i.test(msg)) return "Email ou mot de passe incorrect.";
  if (/User already registered/i.test(msg)) return "Un compte existe déjà avec cet email — essayez de vous connecter.";
  if (/Password should be at least/i.test(msg)) return "Le mot de passe doit contenir au moins 6 caractères.";
  if (/Unable to validate email/i.test(msg)) return "Adresse email invalide.";
  return msg || "Une erreur est survenue, merci de réessayer.";
}

function AccountAuth({ initialMode = "login", recoveryMode, onBack, onLoginSuccess, onPasswordUpdated }) {
  const [mode, setMode] = useState(recoveryMode ? "reset" : initialMode);
  useEffect(() => { if (recoveryMode) setMode("reset"); }, [recoveryMode]);

  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [firstName, setFirstName] = useState("");
  const [lastName, setLastName] = useState("");
  const [phone, setPhone] = useState("");
  const [city, setCity] = useState("");
  const [password2, setPassword2] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [newPassword2, setNewPassword2] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const handleLogin = async () => {
    if (!email.trim() || !password) return;
    setLoading(true); setError("");
    try {
      await signInClient({ email: email.trim(), password });
      onLoginSuccess();
    } catch (e) { setError(friendlyAuthError(e)); }
    setLoading(false);
  };

  const handleSignup = async () => {
    if (!email.trim() || !password || !firstName.trim()) { setError("Prénom, email et mot de passe sont requis."); return; }
    if (password.length < 6) { setError("Le mot de passe doit contenir au moins 6 caractères."); return; }
    if (password !== password2) { setError("Les deux mots de passe ne correspondent pas."); return; }
    setLoading(true); setError("");
    try {
      const res = await signUpClient({
        email: email.trim(), password, firstName: firstName.trim(), lastName: lastName.trim(),
        phone: phone.trim(), city: city.trim(),
      });
      if (res.session) { onLoginSuccess(); }
      else { setMode("check-email"); }
    } catch (e) { setError(friendlyAuthError(e)); }
    setLoading(false);
  };

  const handleForgot = async () => {
    if (!email.trim()) return;
    setLoading(true); setError("");
    try {
      await requestPasswordReset(email.trim());
      setMode("forgot-sent");
    } catch (e) { setError(friendlyAuthError(e)); }
    setLoading(false);
  };

  const handleReset = async () => {
    if (newPassword.length < 6) { setError("Le mot de passe doit contenir au moins 6 caractères."); return; }
    if (newPassword !== newPassword2) { setError("Les deux mots de passe ne correspondent pas."); return; }
    setLoading(true); setError("");
    try {
      await updateClientPassword(newPassword);
      onPasswordUpdated();
    } catch (e) { setError(friendlyAuthError(e)); }
    setLoading(false);
  };

  if (mode === "check-email") {
    return (
      <div className="missu-step" style={{ paddingTop: 30, textAlign: "center" }}>
        <div style={{
          width: 60, height: 60, borderRadius: "50%", margin: "0 auto 18px",
          background: C.blush, display: "flex", alignItems: "center", justifyContent: "center",
        }}>
          <Mail size={24} color={C.roseGoldDeep} />
        </div>
        <h1 style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 22, color: C.espresso, margin: "0 0 10px" }}>
          Vérifiez votre boîte mail
        </h1>
        <p style={{ fontFamily: FONT_BODY, fontSize: 13.5, color: C.espressoSoft, lineHeight: 1.6, marginBottom: 22 }}>
          Un email de confirmation vient d'être envoyé à <strong>{email}</strong>. Cliquez sur le lien qu'il
          contient pour activer votre Espace MYU, puis revenez vous connecter ici.
        </p>
        <GhostButton onClick={() => { setMode("login"); setError(""); }} icon={ChevronLeft}>
          Retour à la connexion
        </GhostButton>
      </div>
    );
  }

  if (mode === "forgot-sent") {
    return (
      <div className="missu-step" style={{ paddingTop: 30, textAlign: "center" }}>
        <div style={{
          width: 60, height: 60, borderRadius: "50%", margin: "0 auto 18px",
          background: C.blush, display: "flex", alignItems: "center", justifyContent: "center",
        }}>
          <Mail size={24} color={C.roseGoldDeep} />
        </div>
        <h1 style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 22, color: C.espresso, margin: "0 0 10px" }}>
          Email envoyé
        </h1>
        <p style={{ fontFamily: FONT_BODY, fontSize: 13.5, color: C.espressoSoft, lineHeight: 1.6, marginBottom: 22 }}>
          Si un compte existe avec l'adresse <strong>{email}</strong>, un lien de réinitialisation vient de lui
          être envoyé.
        </p>
        <GhostButton onClick={() => { setMode("login"); setError(""); }} icon={ChevronLeft}>
          Retour à la connexion
        </GhostButton>
      </div>
    );
  }

  if (mode === "reset") {
    return (
      <div className="missu-step" style={{ paddingTop: 30 }}>
        <AuthHeader icon={KeyRound} title="Nouveau mot de passe" subtitle="Choisissez un nouveau mot de passe pour votre Espace MYU" onBack={onBack} />
        <FieldLabel required>Nouveau mot de passe</FieldLabel>
        <TextInput icon={Lock} type="password" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} placeholder="6 caractères minimum" />
        <div style={{ height: 12 }} />
        <FieldLabel required>Confirmer le mot de passe</FieldLabel>
        <TextInput icon={Lock} type="password" value={newPassword2} onChange={(e) => setNewPassword2(e.target.value)} placeholder="Confirmez votre mot de passe" onKeyDown={(e) => e.key === "Enter" && handleReset()} />
        <ErrorNote>{error}</ErrorNote>
        <div style={{ height: 18 }} />
        <PrimaryButton onClick={handleReset} disabled={loading}>
          {loading ? "Enregistrement..." : "Enregistrer le mot de passe"}
        </PrimaryButton>
      </div>
    );
  }

  if (mode === "forgot") {
    return (
      <div className="missu-step" style={{ paddingTop: 30 }}>
        <AuthHeader icon={KeyRound} title="Mot de passe oublié" subtitle="Recevez un lien pour le réinitialiser" onBack={() => setMode("login")} />
        <FieldLabel required>Email</FieldLabel>
        <TextInput icon={Mail} type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="votre@email.com" onKeyDown={(e) => e.key === "Enter" && handleForgot()} />
        <ErrorNote>{error}</ErrorNote>
        <div style={{ height: 18 }} />
        <PrimaryButton onClick={handleForgot} disabled={loading}>
          {loading ? "Envoi..." : "Envoyer le lien"}
        </PrimaryButton>
      </div>
    );
  }

  if (mode === "signup") {
    return (
      <div className="missu-step" style={{ paddingTop: 30 }}>
        <AuthHeader icon={UserCircle2} title="Créer mon Espace MYU" subtitle="Suivez votre parcours Glow, votre fidélité et vos rendez-vous" onBack={onBack} />
        <FieldLabel required>Prénom</FieldLabel>
        <TextInput icon={User} value={firstName} onChange={(e) => setFirstName(e.target.value)} placeholder="Votre prénom" />
        <div style={{ height: 12 }} />
        <FieldLabel>Nom</FieldLabel>
        <TextInput icon={User} value={lastName} onChange={(e) => setLastName(e.target.value)} placeholder="Votre nom" />
        <div style={{ height: 12 }} />
        <FieldLabel>Téléphone</FieldLabel>
        <TextInput icon={Phone} value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="0696 00 00 00" />
        <div style={{ height: 12 }} />
        <FieldLabel>Ville</FieldLabel>
        <TextInput icon={MapPin} value={city} onChange={(e) => setCity(e.target.value)} placeholder="Votre ville" />
        <div style={{ height: 12 }} />
        <FieldLabel required>Email</FieldLabel>
        <TextInput icon={Mail} type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="votre@email.com" />
        <div style={{ height: 12 }} />
        <FieldLabel required>Mot de passe</FieldLabel>
        <TextInput icon={Lock} type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="6 caractères minimum" />
        <div style={{ height: 12 }} />
        <FieldLabel required>Confirmer le mot de passe</FieldLabel>
        <TextInput icon={Lock} type="password" value={password2} onChange={(e) => setPassword2(e.target.value)} placeholder="Confirmez votre mot de passe" onKeyDown={(e) => e.key === "Enter" && handleSignup()} />
        <ErrorNote>{error}</ErrorNote>
        <div style={{ height: 18 }} />
        <PrimaryButton onClick={handleSignup} disabled={loading}>

// Écran affiché juste après le retour de la page de paiement SumUp. Ne
// confirme jamais rien par lui-même : il interroge la base (mise à jour
// uniquement par /api/sumup-webhook, côté serveur) jusqu'à ce que le statut
// soit définitivement "confirme" (payé), "annule"/"echoue" (paiement raté),
// ou que le délai d'attente soit dépassé (le webhook peut prendre quelques
// secondes de plus, notamment en cas de nouvelle tentative de SumUp).
function PaymentReturnStatus({ rdvId, onClose }) {
  const [rdv, setRdv] = useState(null);
  const [attempts, setAttempts] = useState(0);
  const [error, setError] = useState("");
  const MAX_ATTEMPTS = 10;

  const check = useCallback(async () => {
    try {
      const data = await fetchRendezVousById(rdvId);
      setRdv(data);
    } catch (e) {
      setError(e.message);
    }
  }, [rdvId]);

  useEffect(() => { check(); }, [check]);

  useEffect(() => {
    if (!rdv) return;
    if (rdv.payment_status === "paye" || rdv.payment_status === "echoue" || rdv.statut === "annule") return;
    if (attempts >= MAX_ATTEMPTS) return;
    const t = setTimeout(() => { setAttempts((a) => a + 1); check(); }, 2000);
    return () => clearTimeout(t);
  }, [rdv, attempts, check]);

  const stillWaiting = !rdv || (rdv.payment_status !== "paye" && rdv.payment_status !== "echoue" && rdv.statut !== "annule" && attempts < MAX_ATTEMPTS);
  const confirmed = rdv && rdv.payment_status === "paye" && rdv.statut === "confirme";
  const failed = rdv && (rdv.payment_status === "echoue" || rdv.statut === "annule");

  return (
    <div style={{
      background: C.cream, borderRadius: 22, border: `1.4px solid ${C.goldLine}`,
      padding: "24px 20px", marginBottom: 18, textAlign: "center",
    }}>
      {stillWaiting && (
        <>
          <div style={{
            width: 30, height: 30, margin: "0 auto 14px", borderRadius: "50%",
            border: `3px solid ${C.blushDeep}`, borderTopColor: C.roseGoldDeep,
            animation: "missuSpin 0.8s linear infinite",
          }} />
          <p style={{ fontFamily: FONT_BODY, fontSize: 13.5, color: C.espresso, margin: 0 }}>
            Vérification du paiement en cours...
          </p>
        </>
      )}
      {!stillWaiting && confirmed && (
        <>
          <div style={{
            width: 52, height: 52, margin: "0 auto 14px", borderRadius: "50%",
            background: `linear-gradient(135deg, ${C.roseGold}, ${C.roseGoldDeep})`,
            display: "flex", alignItems: "center", justifyContent: "center",
          }}>
            <Check size={24} color="white" />
          </div>
          <p style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 18, color: C.espresso, margin: "0 0 6px" }}>
            Rendez-vous confirmé !
          </p>
          <p style={{ fontFamily: FONT_BODY, fontSize: 12.5, color: C.espressoSoft, margin: 0 }}>
            Votre acompte a bien été reçu. Retrouvez ce rendez-vous ci-dessous, dans "Mes rendez-vous".
          </p>
        </>
      )}
      {!stillWaiting && failed && (
        <>
          <AlertCircle size={28} color={C.danger} style={{ marginBottom: 10 }} />
          <p style={{ fontFamily: FONT_BODY, fontSize: 13.5, color: C.espresso, margin: "0 0 6px" }}>
            Le paiement n'a pas abouti.
          </p>
          <p style={{ fontFamily: FONT_BODY, fontSize: 12, color: C.espressoSoft, margin: 0 }}>
            Aucune somme n'a été retenue si la transaction a échoué. Vous pouvez retenter la réservation.
          </p>
        </>
      )}
      {!stillWaiting && !confirmed && !failed && (
        <p style={{ fontFamily: FONT_BODY, fontSize: 12.5, color: C.espressoSoft, margin: 0 }}>
          La confirmation prend un peu plus de temps que prévu. Actualisez cette page dans une minute pour voir
          l'état à jour de votre réservation.
        </p>
      )}
      <ErrorNote>{error}</ErrorNote>
      <div style={{ marginTop: 14 }}>
        <GhostButton onClick={onClose}>Fermer</GhostButton>
      </div>
    </div>
  );
}

// Parcours de réservation avec acompte : PRESTATION → CRÉNEAU → RÉCAPITULATIF
// → PAIEMENT (redirection vers la page sécurisée SumUp). La confirmation
// définitive n'a jamais lieu ici — voir PaymentReturnStatus et
// /api/sumup-webhook.
function BookingFlow({ onError }) {
  const [step, setStep] = useState(0);
  const [typePrestation, setTypePrestation] = useState("");
  const [date, setDate] = useState("");
  const [heure, setHeure] = useState("");
  const [reservation, setReservation] = useState(null);
  const [loadingReservation, setLoadingReservation] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState("");

  const bookableServices = SERVICES.filter((s) => s.key !== "conseil");
  const selectedService = SERVICES.find((s) => s.key === typePrestation);

  useEffect(() => {
    if (!typePrestation) { setReservation(null); return; }
    let cancelled = false;
    setLoadingReservation(true);
    fetchPrestationsReservation([typePrestation])
      .then((rows) => { if (!cancelled) setReservation(rows[0] || null); })
      .catch(() => { if (!cancelled) setReservation(null); })
      .finally(() => { if (!cancelled) setLoadingReservation(false); });
    return () => { cancelled = true; };
  }, [typePrestation]);

  const depositAmount = reservation?.deposit_amount ?? null;
  const complet = !!(reservation?.is_limited_offer && (reservation.available_slots ?? 0) <= 0);

  const handleConfirm = async () => {
    setSubmitting(true); setError("");
    try {
      const result = await createBookingCheckout({ typePrestation, dateRdv: date || null, heureRdv: heure || null });
      if (result.checkoutUrl) {
        window.location.href = result.checkoutUrl;
      } else {
        setStep(3);
      }
    } catch (e) {
      setError(e.message);
      setSubmitting(false);
    }
  };

  if (step === 3) {
    return (
      <div style={{ textAlign: "center", padding: "10px 0" }}>
        <Check size={22} color={C.roseGoldDeep} style={{ marginBottom: 8 }} />
        <p style={{ fontFamily: FONT_BODY, fontSize: 13, color: C.espresso, margin: 0 }}>
          Demande enregistrée, aucun acompte requis pour cette prestation.
        </p>
        <div style={{ marginTop: 12 }}>
          <GhostButton onClick={() => { setStep(0); setTypePrestation(""); setDate(""); setHeure(""); }}>
            Faire une nouvelle demande
          </GhostButton>
        </div>
      </div>
    );
  }

  return (
    <div>
      <ProgressDots step={step} total={3} />
      {step === 0 && (
        <div>
          <FieldLabel required>Prestation souhaitée</FieldLabel>
          <select
            value={typePrestation}
            onChange={(e) => setTypePrestation(e.target.value)}
            className="missu-focusable"
            style={{ ...inputStyle }}
          >
            <option value="">Choisir une prestation</option>
            {bookableServices.map((s) => (
              <option key={s.key} value={s.key}>{s.label}{s.price ? ` — ${s.price}€` : ""}</option>
            ))}
          </select>
          {typePrestation && selectedService?.limitedOffer && (
            <div style={{ marginTop: 10 }}><OfferSlotBadge typePrestation={typePrestation} /></div>
          )}
          {typePrestation && complet && (
            <p style={{ fontFamily: FONT_BODY, fontSize: 12, color: C.danger, marginTop: 8 }}>
              Cette offre est complète pour le moment — vous pouvez choisir une autre prestation.
            </p>
          )}
          <div style={{ height: 14 }} />
          <PrimaryButton onClick={() => setStep(1)} disabled={!typePrestation || loadingReservation || complet}>
            Continuer
          </PrimaryButton>
        </div>
      )}
      {step === 1 && (
        <div>
          <FieldLabel>Date souhaitée</FieldLabel>
          <TextInput type="date" value={date} onChange={(e) => setDate(e.target.value)} />
          <div style={{ height: 10 }} />
          <FieldLabel>Heure souhaitée</FieldLabel>
          <TextInput type="time" value={heure} onChange={(e) => setHeure(e.target.value)} />
          <p style={{ fontFamily: FONT_BODY, fontSize: 11, color: C.espressoSoft, margin: "8px 0 0", lineHeight: 1.5 }}>
            Créneau indicatif — l'équipe MYU peut vous recontacter pour l'ajuster.
          </p>
          <div style={{ height: 14 }} />
          <div style={{ display: "flex", gap: 10 }}>
            <GhostButton onClick={() => setStep(0)} icon={ChevronLeft}>Retour</GhostButton>
            <div style={{ flex: 1 }}>
              <PrimaryButton onClick={() => setStep(2)}>Continuer</PrimaryButton>
            </div>
          </div>
        </div>
      )}
      {step === 2 && (
        <div>
          <div style={{ background: C.creamSoft, border: `1px solid ${C.blushDeep}`, borderRadius: 16, padding: "14px 16px", marginBottom: 14 }}>
            <DetailRow label="Prestation" value={selectedService?.label} />
            <DetailRow label="Date" value={date || "À confirmer"} />
            <DetailRow label="Heure" value={heure || "À confirmer"} />
            <DetailRow label="Acompte à régler maintenant" value={depositAmount ? `${depositAmount}€` : "Aucun"} />
          </div>
          <ErrorNote>{error}</ErrorNote>
          <p style={{ fontFamily: FONT_BODY, fontSize: 11.5, color: C.espressoSoft, marginBottom: 14, lineHeight: 1.5 }}>
            {depositAmount
              ? "Le paiement de l'acompte se fait sur la page sécurisée SumUp. Votre rendez-vous n'est définitivement réservé qu'une fois le paiement confirmé."
              : "Cette prestation ne nécessite pas d'acompte."}
          </p>
          <div style={{ display: "flex", gap: 10 }}>
            <GhostButton onClick={() => setStep(1)} icon={ChevronLeft}>Retour</GhostButton>
            <div style={{ flex: 1 }}>
              <PrimaryButton onClick={handleConfirm} disabled={submitting} icon={ShieldCheck}>
                {submitting ? "Redirection..." : depositAmount ? `Payer l'acompte (${depositAmount}€)` : "Confirmer la demande"}
              </PrimaryButton>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function AccountDashboard({ user, profile, onLogout }) {
  const [prestations, setPrestations] = useState([]);
  const [etapesByPrestation, setEtapesByPrestation] = useState({});
  const [suiviByPrestation, setSuiviByPrestation] = useState({});
  const [fidelite, setFidelite] = useState({ tampons: 0 });
  const [parrainages, setParrainages] = useState([]);
  const [avantages, setAvantages] = useState([]);
  const [rendezVous, setRendezVous] = useState([]);
  const [documents, setDocuments] = useState([]);
  const [consignes, setConsignes] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState("");

  const loadAll = useCallback(async () => {
    setLoading(true); setLoadError("");
    try {
      const presta = await fetchPrestations(user.id);
      setPrestations(presta);
      const ids = presta.map((p) => p.id);
      const [etapes, suivi, fid, parr, avant, rdv, docs, cons] = await Promise.all([
        fetchEtapes(ids),
        fetchSuivi(ids),
        fetchFidelite(user.id),
        fetchParrainages(user.id),
        fetchAvantages(user.id),
        fetchRendezVous(user.id),
        fetchDocuments(user.id),
        fetchConsignes([...new Set(presta.map((p) => p.type_prestation))]),
      ]);
      const eMap = {}; etapes.forEach((e) => { (eMap[e.prestation_id] = eMap[e.prestation_id] || []).push(e); });
      const sMap = {}; suivi.forEach((s) => { (sMap[s.prestation_id] = sMap[s.prestation_id] || []).push(s); });
      setEtapesByPrestation(eMap);
      setSuiviByPrestation(sMap);
      setFidelite(fid);
      setParrainages(parr);
      setAvantages(avant);
      setRendezVous(rdv);
      setDocuments(docs);
      setConsignes(cons);
    } catch (e) {
      console.error("Erreur de chargement de l'Espace MYU", e);
      setLoadError("Impossible de charger certaines informations pour le moment. Tirez vers le bas ou revenez plus tard.");
    }
    setLoading(false);
  }, [user.id]);

  useEffect(() => { loadAll(); }, [loadAll]);

  // Retour de la page de paiement SumUp (?rdv=<id> dans l'URL). On ne fait
  // JAMAIS confiance à ce simple retour de navigation : on redemande l'état
  // réel du rendez-vous, qui n'est passé à "confirme" côté base que par
  // /api/sumup-webhook après re-vérification directe auprès de SumUp.
  const [paymentReturnId, setPaymentReturnId] = useState(null);
  useEffect(() => {
    try {
      const params = new URLSearchParams(window.location.search);
      const rdvParam = params.get("rdv");
      if (rdvParam) {
        setPaymentReturnId(rdvParam);
        params.delete("rdv");
        params.delete("paiement");
        const next = window.location.pathname + (params.toString() ? `?${params.toString()}` : "");
        window.history.replaceState({}, "", next);
      }
    } catch {}
  }, []);

  const [bookingCreated, setBookingCreated] = useState(false);

  const [rdvPrestation, setRdvPrestation] = useState("");
  const [rdvDate, setRdvDate] = useState("");
  const [rdvHeure, setRdvHeure] = useState("");
  const [rdvSending, setRdvSending] = useState(false);
  const [rdvSent, setRdvSent] = useState(false);

  const submitRdv = async () => {
    if (!rdvPrestation.trim()) return;
    setRdvSending(true);
    try {
      const created = await createRendezVousRequest(user.id, { prestation: rdvPrestation.trim(), date_rdv: rdvDate || null, heure_rdv: rdvHeure || null });
      setRendezVous((prev) => [...prev, created]);
      setRdvPrestation(""); setRdvDate(""); setRdvHeure("");
      setRdvSent(true);
      setTimeout(() => setRdvSent(false), 3500);
    } catch (e) { console.error("Erreur d'envoi de la demande de rendez-vous", e); }
    setRdvSending(false);
  };

  const [filleulEmail, setFilleulEmail] = useState("");
  const [parrSending, setParrSending] = useState(false);
  const parrSlotsUsed = parrainages.length;

  const submitParrainage = async () => {
    if (!filleulEmail.trim() || parrSlotsUsed >= 2) return;
    setParrSending(true);
    try {
      const created = await createParrainage(user.id, filleulEmail.trim());
      setParrainages((prev) => [...prev, created]);
      setFilleulEmail("");
    } catch (e) { console.error("Erreur d'enregistrement de la recommandation", e); }
    setParrSending(false);
  };

  const [suiviPrestationId, setSuiviPrestationId] = useState("");
  const [suiviJalon, setSuiviJalon] = useState("J+3");
  const [suiviCommentaire, setSuiviCommentaire] = useState("");
  const [suiviPhoto, setSuiviPhoto] = useState(null);
  const [suiviSending, setSuiviSending] = useState(false);
  const [suiviSent, setSuiviSent] = useState(false);

  const eligibleSuiviPrestations = prestations.filter((p) =>
    ["realisee", "en_cicatrisation", "suivi_necessaire", "retouche_a_prevoir"].includes(p.statut)
  );

  const submitSuivi = async () => {
    if (!suiviPrestationId) return;
    setSuiviSending(true);
    try {
      const created = await createSuiviEntry(user.id, {
        prestation_id: suiviPrestationId, jalon: suiviJalon, commentaire: suiviCommentaire, photoFile: suiviPhoto,
      });
      setSuiviByPrestation((prev) => ({
        ...prev, [suiviPrestationId]: [created, ...(prev[suiviPrestationId] || [])],
      }));
      setSuiviCommentaire(""); setSuiviPhoto(null);
      setSuiviSent(true);
      setTimeout(() => setSuiviSent(false), 3500);
    } catch (e) { console.error("Erreur d'envoi du suivi de cicatrisation", e); }
    setSuiviSending(false);
  };

  const nextRdv = rendezVous.find((r) => r.statut !== "annule" && (!r.date_rdv || new Date(r.date_rdv) >= new Date(new Date().toDateString())));
  const nextPrestation = prestations.find((p) => p.statut === "a_venir");

  // RGPD — export : uniquement les données déjà chargées pour cette cliente
  // (aucun appel supplémentaire), assemblées en un fichier JSON téléchargeable.
  const handleExportData = () => {
    const payload = {
      export_genere_le: new Date().toISOString(),
      profil: profile ? {
        prenom: profile.first_name, nom: profile.last_name,
        email: user.email, telephone: profile.phone, ville: profile.city,
        code_recommandation: profile.referral_code,
      } : null,
      prestations,
      etapes_parcours: etapesByPrestation,
      suivi_cicatrisation: suiviByPrestation,
      fidelite,
      parrainages,
      avantages,
      rendez_vous: rendezVous,
      documents_consentements: documents,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `myu-mes-donnees-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  };
