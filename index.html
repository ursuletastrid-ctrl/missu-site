export default function App() {
  useGoogleFonts();

  const [step, setStep] = useState(0);

  const [services, setServices] = useState([]);
  const [personal, setPersonal] = useState({});
  // Lieu présélectionné : un seul lieu réel (Ducos) à ce jour, pas besoin de forcer le clic.
  const [planning, setPlanning] = useState({ lieu: LOCATIONS[0] });
  const [photos, setPhotos] = useState({});
  const [contraSelected, setContraSelected] = useState([]);
  const [contraOther, setContraOther] = useState("");
  const [consents, setConsents] = useState({});
  const [submitting, setSubmitting] = useState(false);
  const [showPrivacy, setShowPrivacy] = useState(false);
  const [majorConfirmed, setMajorConfirmed] = useState(false);

  const [space, setSpace] = useState("client"); // 'client' | 'admin-login' | 'admin' | 'account'
  const [adminToken, setAdminToken] = useState("");
  const [adminTab, setAdminTab] = useState("demandes"); // 'demandes' | 'myu'
  const [submissions, setSubmissions] = useState([]);
  const [loadingSubs, setLoadingSubs] = useState(false);
  const [selectedSubId, setSelectedSubId] = useState(null);

  // Mon Espace MYU — session cliente (Supabase Auth), indépendante de l'espace admin ci-dessus.
  const [authUser, setAuthUser] = useState(null);
  const [authProfile, setAuthProfile] = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [recoveryMode, setRecoveryMode] = useState(false);

  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => {
      setAuthUser(data.session?.user || null);
      setAuthReady(true);
    });
    const { data: sub } = supabase.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY") {
        setRecoveryMode(true);
        setSpace("account");
      }
      setAuthUser(session?.user || null);
      if (event === "SIGNED_OUT") setAuthProfile(null);
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!authUser) { setAuthProfile(null); return; }
    let cancelled = false;
    ensureProfile(authUser)
      .then((p) => { if (!cancelled) setAuthProfile(p); })
      .catch((e) => console.error("Erreur de création/lecture du profil", e));
    return () => { cancelled = true; };
  }, [authUser]);

  const handleAccountLoginSuccess = () => { setSpace("account"); };
  const handlePasswordUpdated = () => { setRecoveryMode(false); setSpace("account"); };
  const handleAccountLogout = async () => {
    try { await signOutClient(); } catch (e) { console.error("Erreur de déconnexion", e); }
    setSpace("client");
  };

  const loadSubmissions = useCallback(async (token) => {
    const t = token || adminToken;
    if (!t) return;
    setLoadingSubs(true);
    try {
      const items = await fetchSubmissionsFromSheet(t);
      items.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      setSubmissions(items);
    } catch (e) {
      console.error("Erreur de chargement des demandes", e);
      setSubmissions([]);
    }
    setLoadingSubs(false);
  }, [adminToken]);

  const handleAdminSuccess = (token) => {
    setAdminToken(token);
    setSpace("admin");
    loadSubmissions(token);
  };

  const handleAdminLogout = () => {
    setSpace("client");
    setAdminToken("");
    setSubmissions([]);
    setSelectedSubId(null);
    setAdminTab("demandes");
  };

  const updateStatus = async (id, status) => {
    setSubmissions((prev) => prev.map((s) => (s.id === id ? { ...s, status } : s)));
    try {
      await postAdminAction({ action: "updateStatus", id, value: status }, adminToken);
    } catch (e) {
      console.error("Erreur mise à jour statut", e);
    }
  };

  const updateNotes = async (id, notes) => {
    setSubmissions((prev) => prev.map((s) => (s.id === id ? { ...s, notes } : s)));
    try {
      await postAdminAction({ action: "updateNotes", id, value: notes }, adminToken);
    } catch (e) {
      console.error("Erreur mise à jour notes", e);
    }
  };

  const selectedSub = submissions.find((s) => s.id === selectedSubId);

  const resetForm = useCallback(() => {
    setServices([]);
    setPersonal({});
    setPlanning({ lieu: LOCATIONS[0] });
    setPhotos({});
    setContraSelected([]);
    setContraOther("");
    setConsents({});
    setStep(0);
    // majorConfirmed volontairement conservé : pas besoin de recertifier
    // la majorité pour une nouvelle demande dans la même session.
  }, []);

  const handlePhotoUpload = async (zoneKey, file) => {
    const dataUrl = await compressImage(file);
    setPhotos((prev) => ({ ...prev, [zoneKey]: dataUrl }));
  };
  const handlePhotoRemove = (zoneKey) => {
    setPhotos((prev) => {
      const next = { ...prev };
      delete next[zoneKey];
      return next;
    });
  };
  const toggleContra = (item) => {
    setContraSelected((prev) => prev.includes(item) ? prev.filter((i) => i !== item) : [...prev, item]);
  };
  const toggleConsent = (key) => setConsents((prev) => ({ ...prev, [key]: !prev[key] }));

  const handleSubmitRequest = async () => {
    setSubmitting(true);
    const id = genId();
    const record = {
      id,
      createdAt: new Date().toISOString(),
      services,
      personal,
      planning,
      photos,
      contraindications: { selected: contraSelected, other: contraOther },
      consents,
      status: "nouveau",
      notes: "",
    };

    let finished = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      setSubmitting(false);
      setStep(7);
    };

    const safetyTimer = setTimeout(finish, 8000);

    try {
      await Promise.race([
        sendToBackupSheet(record),
        new Promise((_, reject) => setTimeout(() => reject(new Error("timeout sheet")), 6000)),
      ]);
    } catch (e) {
      console.error("Erreur d'enregistrement dans le Sheet", e);
    }

    Promise.race([
      sendNewRequestEmail(record),
      new Promise((_, reject) => setTimeout(() => reject(new Error("timeout email")), 6000)),
    ]).catch((e) => console.error("Erreur d'envoi de la notification email", e));

    clearTimeout(safetyTimer);
    finish();
  };

  let content = null;

  if (space === "client") {
    if (step === 0) content = (
      <HomeStep
        onStart={() => setStep(1)}
        onOpenPrivacy={() => setShowPrivacy(true)}
        majorConfirmed={majorConfirmed}
        onToggleMajor={() => setMajorConfirmed((v) => !v)}
        onAdminClick={() => setSpace("admin-login")}
        onAccountClick={() => setSpace("account")}
      />
    );
    else if (step === 1) content = (
      <ServiceStep value={services} onChange={setServices} onNext={() => setStep(2)} onBack={() => setStep(0)} />
    );
    else if (step === 2) content = (
      <PersonalStep data={personal} onChange={setPersonal} onNext={() => setStep(3)} onBack={() => setStep(1)} />
    );
    else if (step === 3) content = (
      <PlanningStep data={planning} onChange={setPlanning} onNext={() => setStep(4)} onBack={() => setStep(2)} />
    );
    else if (step === 4) content = (
      <PhotosStep photos={photos} onUpload={handlePhotoUpload} onRemove={handlePhotoRemove} onNext={() => setStep(5)} onBack={() => setStep(3)} />
    );
    else if (step === 5) content = (
      <ContraStep selected={contraSelected} onToggle={toggleContra} otherText={contraOther} onOtherText={setContraOther} onNext={() => setStep(6)} onBack={() => setStep(4)} services={services} />
    );
    else if (step === 6) content = (
      <ConsentStep
        consents={consents}
        onToggle={toggleConsent}
        onSubmit={handleSubmitRequest}
        onBack={() => setStep(5)}
        submitting={submitting}
        onOpenPrivacy={() => setShowPrivacy(true)}
      />
    );
    else if (step === 7) content = (
      <ConfirmationStep firstName={personal.firstName} onRestart={resetForm} />
    );
  } else if (space === "account") {
    if (!authReady) {
      content = (
        <div className="missu-step" style={{ paddingTop: 60, textAlign: "center" }}>
          <div style={{
            width: 34, height: 34, margin: "0 auto 16px", borderRadius: "50%",
            border: `3px solid ${C.blushDeep}`, borderTopColor: C.roseGoldDeep,
            animation: "missuSpin 0.8s linear infinite",
          }} />
        </div>
      );
    } else if (recoveryMode || !authUser) {
      content = (
        <AccountAuth
          recoveryMode={recoveryMode}
          onBack={() => { setRecoveryMode(false); setSpace("client"); }}
          onLoginSuccess={handleAccountLoginSuccess}
          onPasswordUpdated={handlePasswordUpdated}
        />
      );
    } else {
      content = (
        <AccountDashboard user={authUser} profile={authProfile} onLogout={handleAccountLogout} />
      );
    }
  } else if (space === "admin-login") {
    content = <AdminLogin onSuccess={handleAdminSuccess} onBack={() => setSpace("client")} />;
  } else if (space === "admin") {
    if (selectedSubId && selectedSub) {
      content = (
        <AdminDetail
          submission={selectedSub}
          onBack={() => setSelectedSubId(null)}
          onUpdateStatus={updateStatus}
          onUpdateNotes={updateNotes}
        />
      );
    } else {
      const tabButtonStyle = (key) => ({
        flex: 1, padding: "9px 10px", borderRadius: 99, cursor: "pointer",
        fontFamily: FONT_BODY, fontSize: 12.5, fontWeight: 500,
        border: adminTab === key ? `1.5px solid ${C.roseGoldDeep}` : `1.3px solid ${C.blushDeep}`,
        background: adminTab === key ? C.blush : C.white, color: C.espresso,
      });
      content = (
        <div>
          <div style={{ display: "flex", gap: 8, marginBottom: 16, alignItems: "center" }}>
            <button onClick={() => setAdminTab("demandes")} className="missu-focusable" style={tabButtonStyle("demandes")}>
              Demandes
            </button>
            <button onClick={() => setAdminTab("myu")} className="missu-focusable" style={tabButtonStyle("myu")}>
              Mon Espace MYU
            </button>
            <button onClick={handleAdminLogout} className="missu-focusable" title="Se déconnecter" style={{
              background: "none", border: "none", cursor: "pointer", color: C.espressoSoft,
              display: "flex", alignItems: "center", flexShrink: 0, padding: "6px 4px",
            }}>
              <LogOut size={16} />
            </button>
          </div>
          {adminTab === "demandes" ? (
            <AdminDashboard
              submissions={submissions}
              loading={loadingSubs}
              onOpen={(id) => setSelectedSubId(id)}
              onLogout={handleAdminLogout}
              onRefresh={() => loadSubmissions()}
            />
          ) : (
            <AdminMyuPanel adminToken={adminToken} />
          )}
        </div>
      );
    }
  }

  return (
    <div style={{ minHeight: "100vh", background: C.blush, display: "flex", justifyContent: "center" }}>
      <GlobalStyle />
      <div style={{ width: "100%", maxWidth: 460, minHeight: "100vh", background: C.blush, padding: "22px 18px 50px" }}>
        {content}
      </div>
      {showPrivacy && <PrivacyModal onClose={() => setShowPrivacy(false)} />}
    </div>
  );
}


import { createRoot } from "react-dom/client";
createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
