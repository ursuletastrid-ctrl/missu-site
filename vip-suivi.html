<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ma demande MYU VIP</title><meta name="robots" content="noindex,nofollow"><meta name="description" content="Suivi privé de votre demande MYU VIP."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--blush:#F7E5DF;--blush-deep:#EFD2C7;--cream:#FFFCF8;--cream-soft:#FBF4ED;--rose-gold:#C99A82;--rose-gold-deep:#A9775D;--espresso:#4A372F;--espresso-soft:#86695D}
*{box-sizing:border-box}
body{margin:0;background:var(--cream-soft);color:var(--espresso);font-family:'Jost',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:auto;padding:26px 18px 50px}
.brand{text-align:center;margin:8px 0 26px}
.brand small{letter-spacing:3px;color:var(--rose-gold-deep);font-weight:600;font-size:11px}
.brand h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:40px;margin:6px 0;font-weight:500}
.brand p{margin:0;color:var(--espresso-soft);font-size:13.5px}
.card{background:var(--cream);border:1px solid var(--blush-deep);border-radius:26px;padding:22px;box-shadow:0 14px 34px rgba(74,55,47,.09)}
h2{font-family:'Cormorant Garamond',Georgia,serif;margin:0 0 6px;font-size:27px;font-weight:500}
.sub{font-size:14px;color:var(--espresso-soft);line-height:1.55;margin:0 0 20px}
label{font-size:12px;font-weight:600;display:block;margin:14px 0 6px;color:var(--espresso)}
input,select{width:100%;padding:13px 12px;border:1px solid var(--blush-deep);border-radius:13px;background:var(--cream-soft);font-size:16px;color:var(--espresso);font-family:'Jost',sans-serif}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.consent{display:flex;gap:9px;align-items:flex-start;margin:18px 0;font-size:12px;line-height:1.45;color:var(--espresso-soft)}
.consent input{width:auto;margin-top:2px}
button{width:100%;border:0;border-radius:14px;padding:15px;background:linear-gradient(135deg,var(--rose-gold),var(--rose-gold-deep));color:#fff;font-weight:600;font-size:15px;cursor:pointer;font-family:'Jost',sans-serif;letter-spacing:.3px;box-shadow:0 10px 24px -8px rgba(169,119,93,.5)}
button:disabled{opacity:.5;box-shadow:none}
.trust{text-align:center;font-size:11px;color:var(--espresso-soft);margin:12px 0 0}
.msg{margin:12px 0;padding:11px;border-radius:12px;background:var(--blush);font-size:13px;display:none;color:var(--espresso)}
.back{display:block;text-align:center;color:var(--rose-gold-deep);font-size:12px;margin-top:18px;text-decoration:none}
.price-box{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--blush);display:none}
.price-box.show{display:flex}
.price-box .full{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--espresso);font-weight:600}
.price-box .deposit{font-size:11px;color:var(--rose-gold-deep);font-weight:600;text-align:right}
.success{text-align:center;padding:22px 5px}
.success b{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600}
.hidden,.prediag-cta.hidden{display:none}
#engagements{margin-top:16px;padding:12px 14px;border:1px solid var(--blush-deep);border-radius:16px;background:var(--cream-soft)}
#engagements .consent{margin:10px 0}
.eng-title{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;margin:0}
.slot-days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.slot-day{flex:0 0 auto;width:auto;min-width:74px;padding:9px 10px;border-radius:14px;border:1px solid var(--blush-deep);background:var(--cream-soft);color:var(--espresso);font-size:12px;font-weight:500;box-shadow:none;scroll-snap-align:start;line-height:1.25}
.slot-day b{display:block;font-size:17px;font-family:'Cormorant Garamond',serif}
.slot-day.full{opacity:.45}
.slot-day.sel{background:var(--espresso);border-color:var(--espresso);color:#fff}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin-top:6px}
.slot{width:100%;padding:11px 4px;border-radius:12px;border:1px solid var(--blush-deep);background:#fff;color:var(--espresso);font-size:14px;font-weight:600;box-shadow:none}
.slot.sel{background:linear-gradient(135deg,var(--rose-gold),var(--rose-gold-deep));color:#fff;border-color:transparent}
.slot-note{font-size:12px;color:var(--espresso-soft);margin:8px 0 0;line-height:1.45}
.slot-summary{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--blush);font-size:13.5px;line-height:1.5;display:none}
.slot-summary.show{display:block}
.recap{text-align:left;margin:16px 0 0;padding:14px 16px;border-radius:16px;background:var(--cream-soft);border:1px solid var(--blush-deep);font-size:14px;line-height:1.7}
.recap span{color:var(--espresso-soft);display:inline-block;min-width:92px}
.btn-ghost{background:transparent;color:var(--rose-gold-deep);border:1px solid var(--blush-deep);box-shadow:none;margin-top:10px}

@media(max-width:390px){.grid{grid-template-columns:1fr}.wrap{padding:18px 13px 40px}}
.contact-links{display:grid;gap:10px;margin:14px 0 0;font-style:normal}
.contact-link{display:flex;flex-direction:column;gap:5px;min-height:64px;padding:14px 16px;background:var(--cream-soft);border:1px solid var(--blush-deep);border-radius:16px;text-decoration:none;color:var(--espresso);overflow-wrap:anywhere}
.contact-link small{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--rose-gold-deep)}
.contact-link span{font-size:15px;line-height:1.4}
.contact-link:hover{background:var(--blush)}
.contact-link:focus-visible,.contact-jump:focus-visible{outline:3px solid var(--rose-gold-deep);outline-offset:3px}
.contact-whatsapp{background:var(--espresso);border-color:var(--espresso);color:#fffaf6}
.contact-whatsapp small{color:var(--rose-gold)}
.contact-whatsapp:hover{background:#5c483d}
.contact-link .contact-detail{font-size:12px;font-weight:400;opacity:.85}
.prediag-cta{display:block;text-align:center;text-decoration:none;background:linear-gradient(135deg,var(--rose-gold),var(--rose-gold-deep));color:#fff;padding:15px 17px;border-radius:999px;font-weight:600;font-size:14px;margin-top:16px}

.steps{margin:0 0 18px;padding:0;list-style:none;display:grid;gap:8px}
.steps li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45;color:var(--espresso)}
.steps b{flex:0 0 26px;height:26px;border-radius:50%;background:var(--espresso);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
textarea{width:100%;padding:13px 12px;border:1px solid var(--blush-deep);border-radius:13px;background:var(--cream-soft);font-size:16px;color:var(--espresso);font-family:'Jost',sans-serif;min-height:84px;resize:vertical}
.pot{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.linkbox{word-break:break-all;font-size:12.5px;padding:11px 12px;border-radius:12px;background:var(--cream-soft);border:1px solid var(--blush-deep);margin:12px 0 0;text-align:left}
.vipbadge{display:inline-block;font-size:10.5px;letter-spacing:2px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--espresso);color:#F3D9B1;margin-bottom:6px}

.stat{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.4px;padding:6px 12px;border-radius:999px;background:var(--blush);color:var(--espresso);margin:2px 0 10px}
.stat.ok{background:#DDEFD9;color:#285C2B}.stat.warn{background:#FBE9C8;color:#7A5200}.stat.ko{background:#F3D6D2;color:#8A2D22}
.reply{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--cream-soft);border:1px solid var(--blush-deep);font-size:14px;line-height:1.5}
.reply small{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--rose-gold-deep);margin-bottom:3px}
.deadline{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--espresso);color:#fff;font-size:14px;line-height:1.5}
.deadline b{color:#F3D9B1}
.actions{display:grid;gap:10px;margin-top:16px}
.recap .r{display:flex;gap:10px;line-height:1.55;margin:2px 0}.recap .r span{flex:0 0 84px;min-width:0}.recap .r em{font-style:normal;flex:1}
.actions .btn-ghost{margin-top:0}
</style></head>
<body><main class="wrap">
<div class="brand"><small>MYU BY MISS'U</small><h1>MYU VIP</h1><p>Suivi de ma demande · Votre heure est la mienne</p></div>
<section class="card" id="card"><p class="sub" id="loading">Chargement de votre demande…</p></section>
<a class="back" href="/">← Retour au site MYU</a>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qs=new URLSearchParams(location.search);const T=qs.get('t')||'';const paid=qs.get('paid')==='1';
let polls=0;
const cls={confirme:'ok',accepte_attente_paiement:'warn',contre_proposition:'warn',refuse:'ko',annule:'ko',expire:'ko',en_attente:''};
const row=(l,v)=>'<div class="r"><span>'+esc(l)+'</span><em>'+v+'</em></div>';
const WA='https://wa.me/596696178587';
async function api(action,method,body){
  const r=await fetch('/api/vip?action='+action+'&t='+encodeURIComponent(T),{method:method||'GET',cache:'no-store',headers:body?{'Content-Type':'application/json'}:undefined,body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.success)throw new Error(j.error||'Service momentanément indisponible.');
  return j.data;
}
function render(d,msg){
  let h='<span class="stat '+(cls[d.statut]||'')+'">'+esc(d.statutLibelle)+'</span>';
  h+='<h2>Bonjour '+esc(d.prenom)+'</h2>';
  h+='<div class="recap">'+row('Prestation',esc(d.prestation))+row('Lieu',esc(d.lieu))+row('Demandé',esc(d.souhait.dateLongue)+' à '+esc(String(d.souhait.heure).replace(':','h')))+(d.souhaitAlt?row('Ou bien',esc(d.souhaitAlt.dateLongue)+' à '+esc(String(d.souhaitAlt.heure).replace(':','h'))):'')+'</div>';
  if(d.retenu&&d.statut!=='en_attente'&&d.statut!=='refuse'){h+='<div class="recap" style="margin-top:10px">'+row(d.statut==='contre_proposition'?'Proposé':'Retenu',esc(d.retenu.dateLongue)+' à '+esc(String(d.retenu.heure).replace(':','h')))+'</div>'}
  if(d.reponse){h+='<div class="reply"><small>Message de Miss\'U</small>'+esc(d.reponse)+'</div>'}
  if(msg){h+='<div class="msg" style="display:block" role="alert">'+esc(msg)+'</div>'}
  h+='<div class="actions">';
  if(d.statut==='en_attente'){
    h+='<p class="sub" style="margin:14px 0 0">Votre demande a bien été reçue : Miss\'U l\'étudie et vous répond personnellement. Rien n\'est à payer pour l\'instant. Revenez sur cette page ou écrivez-lui sur WhatsApp.</p>';
  }
  if(d.statut==='contre_proposition'){
    h+='<p class="sub" style="margin:14px 0 0">Miss\'U vous propose un autre créneau. Si vous l\'acceptez, il est réservé pour vous pendant 48 h, le temps de régler l\'acompte.'+(d.supplement>0?' Un supplément VIP de '+esc(d.supplement)+' € est inclus dans l\'acompte.':'')+'</p>';
    h+='<button id="btnAccept" type="button">J\'accepte ce créneau</button>';
  }
  if(d.statut==='accepte_attente_paiement'){
    if(d.maintienActif){
      h+='<div class="deadline">Votre créneau est <b>réservé pour vous</b> jusqu\'au <b>'+esc(d.expireLibelle)+'</b> (heure de Martinique). Passé ce délai sans paiement, il est libéré automatiquement.</div>';
      if(d.acompteTotal!=null){h+='<div class="recap" style="margin-top:12px">'+row('Acompte à régler','<b>'+esc(d.acompteLibelle)+'</b>'+(d.supplement>0?' <small>(dont supplément VIP '+esc(d.supplement)+' €)</small>':''))+'</div>'}
      h+='<label class="consent"><input id="payConsent" type="checkbox"><span>Je confirme ce rendez-vous et j\'accepte de régler l\'acompte indiqué par paiement sécurisé SumUp. Le rendez-vous n\'est confirmé qu\'à réception de l\'acompte.</span></label>';
      h+='<button id="btnPay" type="button">Confirmer et payer l\'acompte</button>';
    }else{
      h+='<p class="sub" style="margin:14px 0 0">Le délai de confirmation est dépassé. Vérification en cours…</p>';
    }
  }
  if(d.statut==='confirme'){
    h+='<p class="sub" style="margin:14px 0 0"><strong>Votre acompte est bien reçu : votre rendez-vous est confirmé.</strong> Miss\'U vous contactera pour les détails si nécessaire. À très vite !</p>';
  }
  if(d.statut==='refuse'||d.statut==='annule'||d.statut==='expire'){
    h+='<p class="sub" style="margin:14px 0 0">'+(d.statut==='expire'?'Le créneau n\'a pas été confirmé à temps et a été libéré. ':'')+'Vous pouvez faire une nouvelle demande ou réserver un créneau classique.</p>';
    h+='<a class="prediag-cta" href="/vip.html">Nouvelle demande VIP</a><a class="prediag-cta" style="background:transparent;color:var(--rose-gold-deep);border:1px solid var(--blush-deep)" href="/book.html">Réserver un créneau classique</a>';
  }
  if(d.peutAnnuler){h+='<button id="btnCancel" type="button" class="btn-ghost">Annuler ma demande</button>'}
  h+='<button id="btnRefresh" type="button" class="btn-ghost">Actualiser</button>';
  h+='<a class="contact-link contact-whatsapp" href="'+WA+'" target="_blank" rel="noopener noreferrer"><small>WhatsApp · Écrire à Miss\'U</small><span>+596 696 17 85 87</span></a></div>';
  $('card').innerHTML=h;
  const on=(id,fn)=>{const e=$(id);if(e)e.addEventListener('click',fn)};
  on('btnRefresh',()=>load());
  on('btnCancel',async()=>{if(!confirm('Annuler cette demande ?'))return;try{render(await api('cancel','POST',{}))}catch(e){render(d,e.message)}});
  on('btnAccept',async()=>{const b=$('btnAccept');b.disabled=true;b.textContent='Réservation du créneau…';try{render(await api('accept','POST',{}))}catch(e){render(d,e.message)}});
  on('btnPay',async()=>{
    if(!$('payConsent').checked){return render(d,'Cochez la case pour confirmer et payer l\'acompte.')}
    const b=$('btnPay');b.disabled=true;b.textContent='Ouverture du paiement sécurisé…';
    try{const r=await api('pay','POST',{consent:true});if(r.dejaPaye)return load();if(r.checkoutUrl){location.href=r.checkoutUrl;return}throw new Error('Lien de paiement indisponible.')}
    catch(e){render(d,e.message)}
  });
}
async function load(msg){
  if(!/^[0-9a-f]{40,100}$/i.test(T)){$('card').innerHTML='<h2>Lien invalide</h2><p class="sub">Ce lien de suivi n\'est pas valide. Vérifiez le lien reçu ou refaites une demande.</p><a class="prediag-cta" href="/vip.html">Nouvelle demande VIP</a>';return}
  try{
    const d=await api('status');
    render(d,msg||(paid&&d.statut!=='confirme'&&polls<6?'Vérification de votre paiement en cours… cette page se met à jour toute seule.':''));
    if(paid&&d.statut==='accepte_attente_paiement'&&polls<6){polls++;setTimeout(()=>load(),4000)}
  }catch(e){$('card').innerHTML='<h2>Demande introuvable</h2><p class="sub">'+esc(e.message)+'</p><a class="prediag-cta" href="/vip.html">Nouvelle demande VIP</a>'}
}
load();
</script>
</body></html>
